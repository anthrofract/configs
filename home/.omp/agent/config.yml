disabledProviders:
  - opencode
setupVersion: 3
shellPath: /etc/nu-with-config/nu
personality: none
modelRoles:
  default: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-fable-5-2:high
  plan: anthropic/claude-opus-5-5:high
  task: anthropic/claude-opus-5-5:high
  vision: "@default"
  smol: anthropic/claude-sonnet-5-5:medium
  tiny: anthropic/claude-haiku-5-5:low
  web: web/keenable
advisor:
  enabled: false
theme:
  dark: bamboo
colorBlindMode: false
statusLine:
  preset: custom
  separator: powerline-thin
  sessionAccent: false
  compactThinkingLevel: false
  leftSegments:
    - pi
    - path
    - session_name
  rightSegments:
    - mode
    - model
    - cost
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
commit:
  enabled: false
composer:
  shape: pi
display:
  shimmer: classic
  showTurnTime: true
  showTokenUsage: true
  shellVisualization: false
bash:
  direnv: "off"
edit:
  blackbox:
    enabled: false
  mode: hashline
symbolPreset: nerd
terminal:
  showProgress: false
tui:
  completeScrollback: true
  textSizing: false
  tight: false
task:
  agentModelOverrides:
    security-reviewer: openai-codex/gpt-6.2-astra:max
  showResolvedModelBadge: false
  eager: preferred
treeFilterMode: no-tools
marketplace:
  autoUpdate: "off"
git:
  enabled: true
branchSummary:
  enabled: false
recap:
  enabled: false
todo:
  reminders: false
model:
  loopGuard:
    toolCallReminder: false
startup:
  quiet: false
  showSplash: false
  checkUpdate: false
dev:
  autoqa: false
compaction:
  thresholdPercent: 80
  enabled: false
hideThinkingBlock: true
extendedContext: true
browser:
  relay: true
ttsr:
  builtinRules: false